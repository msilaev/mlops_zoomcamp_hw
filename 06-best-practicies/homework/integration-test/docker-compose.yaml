services:
  backend:
    image: ${LOCAL_IMAGE_NAME}
    ports:
      - "8081:8080"
    environment:      
      MODEL_RUN_ID: "m-38915c8da8cf4a0bb96336ab6be26c9f"
      AWS_DEFAULT_REGION: "us-east-1"    
      S3_ENDPOINT_URL: "http://localstack:4566"  # Fixed reference
    volumes:    
      - ~/.aws:/root/.aws:ro
    depends_on:
      - localstack  # Fixed reference
  localstack:  # Fixed service name
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3  # Fixed: s3 instead of kinesis:
    